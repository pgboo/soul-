server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: soul-social
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: true

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.soul.social.entity
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 业务自定义配置
soul:
  jwt:
    # 生产用环境变量 SOUL_JWT_SECRET 覆盖；≥32 字节
    secret: ${SOUL_JWT_SECRET:soul-social-jwt-secret-key-please-change-in-production-env-2026}
    # 用户端 token 有效期（天）
    mini-expire-days: 7
    # 后台 token 有效期（天）
    admin-expire-days: 1
  cache:
    # local=内存实现（默认，零 Redis 可启动）；redis=Redis 实现
    type: local
  file:
    storage: local
    local:
      # 相对后端运行目录
      base-dir: ./upload
      # 访问域名前缀，留空返回相对路径，由前端拼 baseURL
      domain: ''
      max-size: 5242880
  cors:
    allowed-origins: '*'
