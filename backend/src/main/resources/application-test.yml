# =====================================================================
#  测试环境配置（对外内测用）
#  启动：java -jar soul-social-backend-1.0.0.jar --spring.profiles.active=test
#  与 dev 的区别：① 连独立测试库 ② 上传目录隔离 ③ 日志落盘 ④ 关掉 SQL 打印
# =====================================================================

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 独立测试库：测试者随便造数据，不影响 soul_social 演示库
    url: jdbc:mysql://localhost:3306/soul_social_test?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull
    # 密码走环境变量 SOUL_DB_PASSWORD，不硬编码进仓库
    username: ${SOUL_DB_USER:root}
    password: ${SOUL_DB_PASSWORD:123456}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

# MyBatis-Plus：内测期关掉 SQL 控制台打印，否则日志被刷屏
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

soul:
  jwt:
    # 对外暴露时务必用环境变量覆盖，不要用仓库里的默认值
    secret: ${SOUL_JWT_SECRET:soul-social-jwt-secret-key-please-change-in-production-env-2026}
  file:
    storage: local
    local:
      # 与正式环境隔离，便于随时清空测试图片
      base-dir: ./upload-test

logging:
  level:
    root: info
    com.soul.social: info
  file:
    name: ./logs/soul-test.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 7
